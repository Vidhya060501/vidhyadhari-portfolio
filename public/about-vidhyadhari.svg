<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Inter', Arial, sans-serif;">
  <defs>
    <style>
      @keyframes steam1 { 0%,100%{transform:translateY(0) scaleX(1)} 50%{transform:translateY(-8px) scaleX(1.2)} }
      @keyframes steam2 { 0%,100%{transform:translateY(0) scaleX(1)} 50%{transform:translateY(-10px) scaleX(0.8)} }
      @keyframes blink  { 0%,100%{opacity:1} 50%{opacity:0} }
      .st1 { animation: steam1 2s ease-in-out infinite; transform-origin: 568px 302px; }
      .st2 { animation: steam2 2.6s ease-in-out infinite 0.4s; transform-origin: 578px 298px; }
      .st3 { animation: steam1 2.2s ease-in-out infinite 0.8s; transform-origin: 588px 302px; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="720" height="500" fill="#0d1117"/>

  <!-- ── DESK SURFACE ── -->
  <rect x="55" y="358" width="640" height="14" rx="5" fill="#1c2236"/>
  <rect x="55" y="370" width="640" height="4" rx="2" fill="#151928"/>

  <!-- ══════════════════════════════════
       DESKTOP MONITOR
  ══════════════════════════════════ -->
  <!-- Monitor outer casing -->
  <rect x="28" y="128" width="218" height="162" rx="14" fill="#c8cad8" filter="url(#softShadow)"/>
  <!-- Screen bezel -->
  <rect x="36" y="136" width="202" height="144" rx="8" fill="#1a1d2e"/>
  <!-- Screen glow -->
  <rect x="39" y="139" width="196" height="138" rx="6" fill="#111422"/>

  <!-- Code on monitor screen -->
  <rect x="50" y="152" width="8"  height="8"  rx="2" fill="#ef4444"/>
  <rect x="62" y="152" width="8"  height="8"  rx="2" fill="#fbbf24"/>
  <rect x="74" y="152" width="8"  height="8"  rx="2" fill="#22c55e"/>
  <rect x="50" y="168" width="52" height="4"  rx="2" fill="#ADB2D4" opacity=".8"/>
  <rect x="56" y="178" width="80" height="4"  rx="2" fill="#6366f1" opacity=".7"/>
  <rect x="56" y="188" width="48" height="4"  rx="2" fill="#22c55e" opacity=".7"/>
  <rect x="50" y="198" width="72" height="4"  rx="2" fill="#ADB2D4" opacity=".6"/>
  <rect x="56" y="208" width="64" height="4"  rx="2" fill="#f59e0b" opacity=".7"/>
  <rect x="56" y="218" width="40" height="4"  rx="2" fill="#3b82f6" opacity=".7"/>
  <rect x="50" y="228" width="90" height="4"  rx="2" fill="#ADB2D4" opacity=".5"/>
  <rect x="56" y="238" width="56" height="4"  rx="2" fill="#22c55e" opacity=".6"/>
  <rect x="50" y="248" width="68" height="4"  rx="2" fill="#ADB2D4" opacity=".45"/>
  <rect x="56" y="258" width="44" height="4"  rx="2" fill="#f59e0b" opacity=".5"/>

  <!-- Monitor bottom bar -->
  <rect x="28" y="284" width="218" height="12" rx="0 0 14 14" fill="#b8bad0"/>
  <!-- Monitor stand neck -->
  <rect x="122" y="296" width="30" height="65" rx="6" fill="#b0b2c8"/>
  <!-- Monitor stand base -->
  <ellipse cx="137" cy="361" rx="60" ry="10" fill="#a8aac0"/>

  <!-- ══════════════════════════════════
       CACTUS
  ══════════════════════════════════ -->
  <!-- Pot -->
  <path d="M270 358 L282 332 H308 L320 358 Z" fill="#d47230"/>
  <rect x="278" y="322" width="34" height="12" rx="3" fill="#e07f40"/>
  <!-- Soil -->
  <ellipse cx="295" cy="323" rx="17" ry="4" fill="#5c3a1a"/>
  <!-- Main cactus stem -->
  <rect x="288" y="248" width="14" height="76" rx="7" fill="#3a8a3a"/>
  <!-- Top round -->
  <circle cx="295" cy="248" r="7" fill="#3a8a3a"/>
  <!-- Left arm -->
  <path d="M288 278 Q268 278 268 262 Q268 252 274 250" stroke="#3a8a3a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="274" cy="250" r="5.5" fill="#3a8a3a"/>
  <!-- Right arm -->
  <path d="M302 286 Q322 286 322 270 Q322 260 316 258" stroke="#3a8a3a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="316" cy="258" r="5.5" fill="#3a8a3a"/>
  <!-- Spines -->
  <line x1="292" y1="258" x2="285" y2="254" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="298" y1="263" x2="305" y2="259" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="291" y1="273" x2="284" y2="270" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="299" y1="278" x2="306" y2="275" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="291" y1="296" x2="284" y2="293" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="299" y1="301" x2="306" y2="298" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="268" y1="264" x2="262" y2="261" stroke="#2d6e2d" stroke-width="1.8"/>
  <line x1="322" y1="272" x2="328" y2="269" stroke="#2d6e2d" stroke-width="1.8"/>

  <!-- ══════════════════════════════════
       GIRL
  ══════════════════════════════════ -->
  <!-- Chair legs -->
  <rect x="378" y="380" width="14" height="60" rx="5" fill="#2a2d3e"/>
  <rect x="428" y="380" width="14" height="60" rx="5" fill="#2a2d3e"/>
  <!-- Chair seat -->
  <rect x="356" y="368" width="110" height="18" rx="9" fill="#363a50"/>
  <!-- Chair back -->
  <rect x="370" y="318" width="80" height="56" rx="10" fill="#363a50"/>
  <rect x="382" y="328" width="56" height="38" rx="7" fill="#2a2d3e"/>

  <!-- Torso — coral top -->
  <path d="M358 288 Q358 272 411 268 Q464 268 464 284 L468 368 H354 Z" fill="#E8836A"/>
  <!-- Shirt collar V-neck -->
  <path d="M395 273 Q411 292 427 273" stroke="#c96a55" stroke-width="2.5" fill="none"/>

  <!-- Left arm -->
  <path d="M362 296 Q336 326 350 362" stroke="#f0c49a" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M460 296 Q486 326 472 362" stroke="#f0c49a" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Hands (slightly flattened circles) -->
  <ellipse cx="352" cy="364" rx="16" ry="11" fill="#f0c49a"/>
  <ellipse cx="470" cy="364" rx="16" ry="11" fill="#f0c49a"/>

  <!-- Neck -->
  <rect x="401" y="251" width="20" height="22" rx="10" fill="#f0c49a"/>

  <!-- Head base -->
  <ellipse cx="411" cy="225" rx="48" ry="50" fill="#f0c49a"/>

  <!-- ── HAIR ── -->
  <!-- Back/sides of hair (drawn behind head features) -->
  <ellipse cx="411" cy="203" rx="48" ry="28" fill="#5c3317"/>
  <!-- Hair left side draping down -->
  <path d="M363 218 Q350 248 356 280 Q360 295 370 292" fill="#5c3317"/>
  <!-- Hair right side -->
  <path d="M459 218 Q472 248 466 280 Q462 295 452 292" fill="#5c3317"/>
  <!-- Hair top surface (lighter shade for depth) -->
  <ellipse cx="411" cy="196" rx="44" ry="22" fill="#6b3d1e"/>
  <!-- Hair highlight -->
  <path d="M380 196 Q411 186 442 196" stroke="#7a4828" stroke-width="8" fill="none" stroke-linecap="round" opacity=".55"/>
  <!-- Small hair wisps on forehead -->
  <path d="M388 210 Q395 204 402 208" stroke="#5c3317" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M420 207 Q428 202 434 207" stroke="#5c3317" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- ── FACE ── -->
  <!-- Eyes white -->
  <circle cx="396" cy="228" r="8" fill="white"/>
  <circle cx="426" cy="228" r="8" fill="white"/>
  <!-- Iris -->
  <circle cx="397" cy="228" r="5" fill="#3a2010"/>
  <circle cx="427" cy="228" r="5" fill="#3a2010"/>
  <!-- Pupil highlight -->
  <circle cx="398.5" cy="226.5" r="1.8" fill="white"/>
  <circle cx="428.5" cy="226.5" r="1.8" fill="white"/>
  <!-- Eyebrows -->
  <path d="M388 217 Q396 212 404 217" stroke="#3a2010" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M418 217 Q426 212 434 217" stroke="#3a2010" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Glasses frames -->
  <rect x="383" y="221" width="24" height="16" rx="8" fill="none" stroke="#999" stroke-width="2.8"/>
  <rect x="413" y="221" width="24" height="16" rx="8" fill="none" stroke="#999" stroke-width="2.8"/>
  <line x1="407" y1="229" x2="413" y2="229" stroke="#999" stroke-width="2.8"/>
  <line x1="366" y1="229" x2="383" y2="229" stroke="#999" stroke-width="2.5"/>
  <line x1="437" y1="229" x2="453" y2="229" stroke="#999" stroke-width="2.5"/>
  <!-- Nose -->
  <path d="M408 238 Q411 245 414 238" stroke="#d4a080" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M398 248 Q411 260 424 248" stroke="#c07060" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Cheeks blush -->
  <circle cx="386" cy="246" r="9" fill="#ff8888" opacity=".2"/>
  <circle cx="436" cy="246" r="9" fill="#ff8888" opacity=".2"/>
  <!-- Ears -->
  <ellipse cx="363" cy="228" rx="7" ry="10" fill="#f0c49a"/>
  <ellipse cx="459" cy="228" rx="7" ry="10" fill="#f0c49a"/>

  <!-- ══════════════════════════════════
       LAPTOP
  ══════════════════════════════════ -->
  <!-- Laptop screen lid -->
  <rect x="338" y="196" width="186" height="140" rx="11" fill="#c8c8cc" filter="url(#softShadow)"/>
  <rect x="345" y="203" width="172" height="122" rx="7" fill="#181b2e"/>
  <!-- Menu bar on screen -->
  <rect x="345" y="203" width="172" height="11" rx="5" fill="#252840"/>
  <circle cx="355" cy="208.5" r="3" fill="#ff5f57"/>
  <circle cx="364" cy="208.5" r="3" fill="#ffbd2e"/>
  <circle cx="373" cy="208.5" r="3" fill="#28ca41"/>
  <!-- Code lines on laptop screen -->
  <rect x="356" y="222" width="56" height="4" rx="2" fill="#ADB2D4" opacity=".8"/>
  <rect x="364" y="231" width="86" height="4" rx="2" fill="#6366f1" opacity=".7"/>
  <rect x="364" y="240" width="68" height="4" rx="2" fill="#22c55e" opacity=".7"/>
  <rect x="356" y="249" width="78" height="4" rx="2" fill="#f59e0b" opacity=".7"/>
  <rect x="364" y="258" width="50" height="4" rx="2" fill="#ADB2D4" opacity=".6"/>
  <rect x="364" y="267" width="92" height="4" rx="2" fill="#3b82f6" opacity=".7"/>
  <rect x="356" y="276" width="62" height="4" rx="2" fill="#ADB2D4" opacity=".5"/>
  <rect x="364" y="285" width="44" height="4" rx="2" fill="#22c55e" opacity=".6"/>
  <rect x="356" y="294" width="74" height="4" rx="2" fill="#f59e0b" opacity=".5"/>
  <rect x="356" y="303" width="38" height="4" rx="2" fill="#ADB2D4" opacity=".45"/>
  <!-- Cursor blink -->
  <rect class="cursor" x="395" y="312" width="2.5" height="8" rx="1" fill="#ADB2D4"/>
  <!-- Apple logo -->
  <ellipse cx="431" cy="178" rx="10" ry="11" fill="#b0b0b4" opacity=".45"/>
  <!-- Hinge -->
  <rect x="338" y="332" width="186" height="7" rx="2" fill="#b0b0b4"/>
  <!-- Keyboard base -->
  <rect x="330" y="338" width="202" height="20" rx="5" fill="#c4c4c8"/>
  <!-- Keyboard surface -->
  <rect x="338" y="341" width="186" height="14" rx="3" fill="#b8b8bc"/>
  <!-- Trackpad -->
  <rect x="405" y="344" width="52" height="8" rx="4" fill="#a8a8ac"/>

  <!-- ══════════════════════════════════
       COFFEE MUG
  ══════════════════════════════════ -->
  <rect x="548" y="318" width="40" height="42" rx="6" fill="#E8836A" filter="url(#softShadow)"/>
  <!-- Handle -->
  <path d="M588 327 Q608 327 608 339 Q608 351 588 351" stroke="#E8836A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Mug rim -->
  <rect x="548" y="318" width="40" height="8" rx="6" fill="#d4705a"/>
  <!-- Mug liquid/top -->
  <ellipse cx="568" cy="322" rx="17" ry="4" fill="#c05848"/>
  <!-- Mug stripe detail -->
  <rect x="554" y="334" width="28" height="3" rx="1.5" fill="#d4705a" opacity=".5"/>
  <!-- Steam wisps -->
  <path class="st1" d="M562 316 Q565 306 561 296" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".4"/>
  <path class="st2" d="M570 313 Q574 302 570 292" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".35"/>
  <path class="st3" d="M578 316 Q581 306 578 296" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".4"/>

  <!-- ══════════════════════════════════
       NOTEBOOK / NOTEPAD
  ══════════════════════════════════ -->
  <g transform="rotate(-8 650 370)">
    <rect x="610" y="342" width="92" height="68" rx="5" fill="#e04040"/>
    <!-- Spiral binding rings -->
    <circle cx="617" cy="350" r="5" fill="#c02020"/>
    <circle cx="617" cy="363" r="5" fill="#c02020"/>
    <circle cx="617" cy="376" r="5" fill="#c02020"/>
    <circle cx="617" cy="389" r="5" fill="#c02020"/>
    <!-- Page lines -->
    <rect x="626" y="352" width="66" height="3" rx="1.5" fill="white" opacity=".35"/>
    <rect x="626" y="361" width="60" height="3" rx="1.5" fill="white" opacity=".35"/>
    <rect x="626" y="370" width="66" height="3" rx="1.5" fill="white" opacity=".35"/>
    <rect x="626" y="379" width="54" height="3" rx="1.5" fill="white" opacity=".35"/>
    <rect x="626" y="388" width="62" height="3" rx="1.5" fill="white" opacity=".35"/>
    <!-- Page edge white -->
    <rect x="620" y="342" width="82" height="68" rx="3" fill="white" opacity=".08"/>
  </g>

  <!-- ══════════════════════════════════
       SPEECH BUBBLES — Vidhyadhari's tech
       (same style/positions as Mansi's)
  ══════════════════════════════════ -->

  <!-- 1. GREEN  "</>"  — top-left  (Mansi had same green code box) -->
  <g filter="url(#shadow)">
    <rect x="128" y="72" width="122" height="70" rx="14" fill="#4CAF50"/>
    <!-- bubble tail pointing down toward girl -->
    <polygon points="178,142 202,142 188,166" fill="#4CAF50"/>
  </g>
  <text x="189" y="118" text-anchor="middle" font-size="34" font-weight="900"
        font-family="'Courier New', monospace" fill="white">&lt;/&gt;</text>

  <!-- 2. ORANGE  "Java"  — top-right  (Mansi had red/orange HTML box) -->
  <g filter="url(#shadow)">
    <rect x="476" y="60" width="140" height="68" rx="14" fill="#E37C2C"/>
    <polygon points="518,128 544,128 529,152" fill="#E37C2C"/>
  </g>
  <text x="546" y="104" text-anchor="middle" font-size="30" font-weight="800"
        font-family="Inter, Arial, sans-serif" fill="white">Java</text>

  <!-- 3. YELLOW  "Py"  — left side  (Mansi had yellow Js box) -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="88" height="88" rx="14" fill="#FFD43B"/>
    <polygon points="128,316 152,316 138,340" fill="#FFD43B"/>
  </g>
  <text x="114" y="281" text-anchor="middle" font-size="30" font-weight="900"
        font-family="Inter, Arial, sans-serif" fill="#1a1a1a">Py</text>
  <text x="114" y="305" text-anchor="middle" font-size="13" font-weight="700"
        font-family="Inter, Arial, sans-serif" fill="#1a1a1a" opacity=".75">Python</text>

  <!-- 4. BLUE CIRCLE  "Docker"  — right side  (Mansi had blue C++ circle) -->
  <g filter="url(#shadow)">
    <circle cx="592" cy="242" r="64" fill="#2496ED"/>
  </g>
  <text x="592" y="237" text-anchor="middle" font-size="22" font-weight="800"
        font-family="Inter, Arial, sans-serif" fill="white">🐳</text>
  <text x="592" y="260" text-anchor="middle" font-size="20" font-weight="800"
        font-family="Inter, Arial, sans-serif" fill="white">Docker</text>

  <!-- 5. DARK  "Kafka"  — lower right  (Mansi had dark PHP box) -->
  <g filter="url(#shadow)">
    <rect x="484" y="316" width="134" height="58" rx="12" fill="#1a1a2e"/>
    <rect x="484" y="316" width="134" height="58" rx="12" fill="none" stroke="#4a4a6e" stroke-width="2"/>
    <polygon points="520,316 548,316 532,294" fill="#1a1a2e"/>
  </g>
  <text x="551" y="352" text-anchor="middle" font-size="24" font-weight="800"
        font-family="'Courier New', monospace" fill="white">Kafka</text>

  <!-- ══════════════════════════════════
       EXTRA SMALL BUBBLES (bonus tech)
  ══════════════════════════════════ -->
  <!-- Spring Boot — small green pill, upper area -->
  <g filter="url(#shadow)" opacity=".9">
    <rect x="338" y="44" width="150" height="46" rx="23" fill="#6DB33F"/>
  </g>
  <text x="413" y="73" text-anchor="middle" font-size="17" font-weight="700"
        font-family="Inter, Arial, sans-serif" fill="white">🍃 Spring Boot</text>

  <!-- AWS — small orange pill, bottom area -->
  <g filter="url(#shadow)" opacity=".9">
    <rect x="134" y="348" width="108" height="40" rx="20" fill="#FF9900"/>
  </g>
  <text x="188" y="373" text-anchor="middle" font-size="16" font-weight="700"
        font-family="Inter, Arial, sans-serif" fill="white">☁️ AWS</text>

</svg>
