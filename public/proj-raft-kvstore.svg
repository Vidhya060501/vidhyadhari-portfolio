<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0d1120"/>

  <!-- Leader node -->
  <circle cx="200" cy="110" r="32" fill="#ADB2D4" opacity="0.12" stroke="#ADB2D4" stroke-width="1.8"/>
  <text x="200" y="106" text-anchor="middle" fill="#ADB2D4" font-size="11" font-family="sans-serif" font-weight="700">LEADER</text>
  <text x="200" y="122" text-anchor="middle" fill="#ADB2D4" font-size="10" font-family="sans-serif" opacity="0.7">term: 4</text>

  <!-- Follower node left -->
  <circle cx="80" cy="210" r="28" fill="#6366f1" opacity="0.10" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="206" text-anchor="middle" fill="#6366f1" font-size="10" font-family="sans-serif" font-weight="700">FOLLOWER</text>
  <text x="80" y="220" text-anchor="middle" fill="#6366f1" font-size="9" font-family="sans-serif" opacity="0.7">synced</text>

  <!-- Follower node right -->
  <circle cx="320" cy="210" r="28" fill="#6366f1" opacity="0.10" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="206" text-anchor="middle" fill="#6366f1" font-size="10" font-family="sans-serif" font-weight="700">FOLLOWER</text>
  <text x="320" y="220" text-anchor="middle" fill="#6366f1" font-size="9" font-family="sans-serif" opacity="0.7">synced</text>

  <!-- Failed node (simulated 33% failure) -->
  <circle cx="200" cy="230" r="22" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="200" y="226" text-anchor="middle" fill="#ef4444" font-size="9" font-family="sans-serif" font-weight="700">NODE</text>
  <text x="200" y="240" text-anchor="middle" fill="#ef4444" font-size="8.5" font-family="sans-serif" opacity="0.8">failed · 33%</text>

  <!-- Log replication arrows leader -> followers -->
  <line x1="172" y1="132" x2="104" y2="186" stroke="#ADB2D4" stroke-width="1.4" opacity="0.5" marker-end="url(#arr)"/>
  <line x1="228" y1="132" x2="296" y2="186" stroke="#ADB2D4" stroke-width="1.4" opacity="0.5" marker-end="url(#arr)"/>

  <!-- Raft log entries -->
  <rect x="148" y="40" width="20" height="14" rx="2" fill="#ADB2D4" opacity="0.25"/>
  <rect x="171" y="40" width="20" height="14" rx="2" fill="#ADB2D4" opacity="0.35"/>
  <rect x="194" y="40" width="20" height="14" rx="2" fill="#ADB2D4" opacity="0.5"/>
  <rect x="217" y="40" width="20" height="14" rx="2" fill="#6366f1" opacity="0.7"/>
  <text x="200" y="30" text-anchor="middle" fill="#ADB2D4" font-size="9" font-family="sans-serif" opacity="0.6">Raft log</text>

  <!-- gRPC / k6 label -->
  <text x="200" y="278" text-anchor="middle" fill="#ADB2D4" font-size="11" font-family="sans-serif" opacity="0.5">gRPC · Raft · sub-5ms P99 · k6</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ADB2D4" opacity="0.5"/>
    </marker>
  </defs>
</svg>
